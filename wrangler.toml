name = "daub"
compatibility_date = "2026-02-27"
pages_build_output_dir = "."

# Environment variables for MCP server (set via Cloudflare dashboard or wrangler secret)
# OPENROUTER_API_KEY — required for generate_ui (LLM generation)
# GEMINI_API_KEY — required for RAG (gemini-embedding-2-preview, Google-only)
# OPENVERSE_CLIENT_ID / OPENVERSE_CLIENT_SECRET: optional; /api/photo works without them. A free registered
#   Openverse app raises the limit from 20/min, 200/day per egress IP to 100/min, 10,000/day.
#
# SMART_QUOTA_SALT: optional secret salt for /api/smart quota keys. Set it once; changing it resets that day's counts.
#
# Rate limiting: Pages has no rate-limit binding type, so RL_WEBLOOK, RL_GENERATE, RL_MCP and RL_PHOTO
# are always unbound and the handlers skip those checks (they fail open). A zone WAF rate-limiting rule
# limits /api/* instead: 60 requests / 10 s per IP, then a 10 s block.

# Smart mode daily budget (/api/smart): 10 runs per IP per UTC day. Namespace title: DAUB_SMART_QUOTA.
# /api/smart answers 503 without this binding, and the playground stays in normal mode.
[[kv_namespaces]]
binding = "SMART_QUOTA"
id = "1aeec0ea7a8b4a8d92f36574a432cc53"
